# Inactive teaching example. Intended repository layout: delivery/ at its root.
# Copy into .github/workflows only in your own lab repo when ready to publish.
name: Learning delivery checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed project pin
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # reviewed project pin
        with:
          python-version: '3.14'
      - name: Check the learner implementation
        run: python delivery/check.py
